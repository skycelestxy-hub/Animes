<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0e0d13">
<meta name="description" content="yozora — seu diário pessoal de animes assistidos">
<title>yozora — diário de animes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='mg' x1='4' y1='2' x2='28' y2='30' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0' stop-color='%23ffc7da'/%3E%3Cstop offset='.55' stop-color='%23ff8fb1'/%3E%3Cstop offset='1' stop-color='%23c08bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23mg)' d='M22 4a12 12 0 1 0 6 22.2A14 14 0 0 1 22 4Z'/%3E%3Cpath fill='%238de8d0' d='M25.6 5.4l1 2.3 2.3 1-2.3 1-1 2.3-1-2.3-2.3-1 2.3-1z'/%3E%3Ccircle cx='7.4' cy='25.2' r='1' fill='%238de8d0' opacity='.75'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============ TOKENS ============ */
  :root{
    --ink:#0e0d13;
    --dusk:#161420;
    --card:#191722;
    --card-hover:#1e1c29;
    --line:rgba(241,238,252,.07);
    --line-strong:rgba(241,238,252,.16);
    --paper:#f1eefc;
    --mist:#9d9ab8;
    --mist-dim:#68657f;
    --bloom:#ff8fb1;
    --bloom-ink:#2b0f18;
    --aurora:#8de8d0;
    --violet:#b79bff;
    --danger:#ff8a8a;
    --radius-lg:24px;
    --radius-md:16px;
    --radius-sm:12px;
    --shadow-soft:0 20px 50px -24px rgba(0,0,0,.6);
    --shadow-pop:0 30px 70px -20px rgba(0,0,0,.7);
    --ease:cubic-bezier(.22,1,.36,1);
    --ease-spring:cubic-bezier(.34,1.56,.64,1);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:'Manrope',sans-serif;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    font-weight:600;
    letter-spacing:-.01em;
    margin:0;
  }
  ::selection{background:var(--bloom);color:var(--bloom-ink);}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--bloom);outline-offset:3px;border-radius:6px;}
  button{font-family:inherit;cursor:pointer;}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ animation-duration:.001s !important; transition-duration:.001s !important; }
  }

  /* ============ AMBIENT BACKGROUND ============ */
  #ambient{ position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none; }
  .lantern{ position:absolute; border-radius:50%; filter:blur(70px); opacity:.35; animation:drift ease-in-out infinite alternate; will-change:transform; }
  @keyframes drift{ from{ transform:translate(0,0) scale(1); } to{ transform:translate(var(--dx,40px),var(--dy,-30px)) scale(1.08); } }
  .star{
    position:absolute; border-radius:50%; background:var(--paper);
    animation:twinkle ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:.12; transform:scale(1); }
    50%{ opacity:.95; transform:scale(1.5); }
  }
  .drop{
    position:absolute; top:-40px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.9), rgba(255,255,255,0) 70%);
    animation:fall linear infinite;
    will-change:transform;
  }
  @keyframes fall{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    8%{ opacity:.7; }
    92%{ opacity:.5; }
    100%{ transform:translateY(112vh) translateX(var(--drift,20px)); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){ .lantern,.star,.drop{animation:none !important;} }

  /* ============ LAYOUT / SCREENS ============ */
  #app{ position:relative; z-index:1; min-height:100vh; }
  .screen{
    position:absolute; inset:0; min-height:100vh;
    opacity:0; transform:translateY(10px); pointer-events:none;
    transition:opacity .5s var(--ease), transform .5s var(--ease);
  }
  .screen.active{ position:relative; opacity:1; transform:translateY(0); pointer-events:auto; }

  /* ---- landing ---- */
  #screen-landing .landing-wrap{
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding:32px; gap:20px;
  }
  .mark{
    display:flex; align-items:center; gap:9px;
    font-weight:800; font-size:13px; letter-spacing:.32em;
    text-transform:uppercase; color:var(--mist);
  }
  .mark svg{width:22px;height:22px;flex:none;filter:drop-shadow(0 3px 10px rgba(255,143,177,.5));}
  .landing-wrap h1{ font-size:clamp(2.4rem,7vw,4.6rem); line-height:1.04; color:var(--paper); }
  .landing-wrap h1 em{ font-style:italic; color:var(--bloom); }
  .landing-sub{ color:var(--mist); font-size:15.5px; max-width:400px; line-height:1.6; margin:0; }
  .landing-count{ font-size:13px; color:var(--aurora); letter-spacing:.02em; }

  /* ---- buttons ---- */
  .btn{
    border:none; border-radius:999px; padding:14px 26px; font-size:14.5px; font-weight:700;
    display:inline-flex; align-items:center; gap:9px;
    transition:transform .3s var(--ease), box-shadow .3s var(--ease), background .25s, opacity .25s;
  }
  .btn:active{ transform:scale(.96); }
  .btn-primary{ background:var(--bloom); color:var(--bloom-ink); box-shadow:0 12px 28px -12px rgba(255,143,177,.5); }
  .btn-primary:hover{ transform:translateY(-2px); box-shadow:0 18px 36px -12px rgba(255,143,177,.65); }
  .btn-secondary{ background:var(--card); color:var(--paper); border:1px solid var(--line-strong); }
  .btn-secondary:hover{ background:var(--card-hover); transform:translateY(-2px); }
  .btn-icon{
    background:var(--card); color:var(--paper); border:1px solid var(--line-strong);
    width:42px; height:42px; border-radius:50%; padding:0; display:inline-flex; align-items:center; justify-content:center;
  }
  .btn-icon:hover{ background:var(--card-hover); transform:translateY(-2px); }
  .btn-ghost{ background:none; border:none; color:var(--mist); padding:10px 6px; font-weight:600; font-size:14px; transition:color .25s; }
  .btn-ghost:hover{ color:var(--paper); }
  .btn-danger{
    background:none; border:1.5px solid rgba(255,138,138,.3); color:var(--danger);
    border-radius:999px; padding:11px 20px; font-weight:700; font-size:13.5px; transition:background .25s, transform .25s;
  }
  .btn-danger:hover{ background:rgba(255,138,138,.1); }
  .btn[disabled]{ opacity:.4; pointer-events:none; }
  .btn-organize.is-active{ background:var(--aurora); border-color:var(--aurora); color:#0f2b23; }

  /* ---- top bar ---- */
  .top-bar{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 32px 0; gap:16px; flex-wrap:wrap;
  }
  .top-bar-right{ display:flex; gap:10px; }
  .file-input-hidden{ display:none; }

  /* ---- list screen ---- */
  .list-wrap{ max-width:1080px; margin:0 auto; padding:28px 32px 100px; }
  .list-header{
    display:flex; align-items:flex-end; justify-content:space-between;
    gap:18px; flex-wrap:wrap; margin-bottom:28px;
  }
  .list-header h2{ font-size:clamp(1.7rem,4vw,2.2rem); color:var(--paper); }
  .list-eyebrow{
    color:var(--aurora); font-size:12.5px; letter-spacing:.09em; text-transform:uppercase;
    font-weight:700; margin:0 0 6px;
  }
  .list-actions{ display:flex; gap:10px; flex-wrap:wrap; }

  .search-row{ margin-bottom:24px; }
  .search-box{
    display:flex; align-items:center; gap:10px; max-width:340px;
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    padding:11px 16px; color:var(--mist);
    transition:border-color .25s, background .25s;
  }
  .search-box:focus-within{ border-color:rgba(255,143,177,.35); }
  .search-box svg{ flex:none; opacity:.8; }
  .search-box input{ flex:1; min-width:0; background:none; border:none; color:var(--paper); font-size:14px; font-family:inherit; }
  .search-box input:focus{ outline:none; }
  .search-box input::placeholder{ color:var(--mist-dim); }
  .search-clear{ flex:none; border:none; background:none; color:var(--mist); font-size:19px; line-height:1; padding:0 2px; transition:color .2s; }
  .search-clear:hover{ color:var(--paper); }

  .reorder-hint{
    display:flex; align-items:center; gap:9px; margin:0 0 20px;
    background:rgba(141,232,208,.08); border:1px solid rgba(141,232,208,.25);
    color:var(--aurora); font-size:13px; font-weight:600; line-height:1.5;
    padding:12px 16px; border-radius:var(--radius-sm);
    animation:rise .35s var(--ease) both;
  }
  .reorder-hint svg{ flex:none; }

  .anime-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
  @media (max-width:920px){ .anime-grid{ grid-template-columns:repeat(3,1fr); } }
  @media (max-width:680px){ .anime-grid{ grid-template-columns:repeat(2,1fr); gap:14px; } }

  .card{
    position:relative; background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius-md); overflow:hidden; text-align:left; padding:0; color:inherit;
    display:flex; flex-direction:column; width:100%;
    animation:rise .45s var(--ease) both; animation-delay:calc(var(--i,0) * 35ms);
    transition:transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s;
  }
  @keyframes rise{ from{ opacity:0; transform:translateY(12px) scale(.98); } to{ opacity:1; transform:translateY(0) scale(1); } }
  .card.is-clickable{ cursor:pointer; }
  .card.is-clickable:hover{ transform:translateY(-4px); box-shadow:var(--shadow-soft); border-color:rgba(255,143,177,.3); }
  .card.is-clickable:active{ transform:translateY(-1px) scale(.98); }

  .card.is-reordering{ cursor:pointer; touch-action:none; }
  .card.is-reordering:hover{ transform:none; box-shadow:none; border-color:var(--line); }
  .card.is-selected{ border-color:var(--aurora); box-shadow:0 0 0 2px var(--aurora) inset; }
  .card.is-dragging{ opacity:.4; border-color:var(--aurora); z-index:5; }
  .card.is-drop-target{ border-color:var(--aurora); box-shadow:0 0 0 2px var(--aurora) inset; }
  .card.is-touch-floating{
    position:fixed; z-index:50; pointer-events:none; opacity:.94;
    box-shadow:var(--shadow-pop); border-color:var(--aurora);
    transition:none !important;
  }

  .card-cover{
    position:relative; display:block; width:100%; aspect-ratio:2/3; flex:none;
    background:linear-gradient(160deg,#221f30,#15131e); overflow:hidden;
  }
  .card-cover img{ width:100%; height:100%; object-fit:cover; display:block; }
  .card-cover .no-cover{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--mist); opacity:.45; }
  .card-cover .no-cover svg{ width:32px; height:32px; }
  .card-rating{
    position:absolute; top:9px; left:9px;
    background:rgba(10,9,15,.82); backdrop-filter:blur(6px);
    color:var(--paper); font-weight:800; font-size:12px;
    padding:5px 9px; border-radius:8px; letter-spacing:.01em;
    box-shadow:0 6px 14px -4px rgba(0,0,0,.5);
  }
  .card-body{ display:block; width:100%; padding:12px 13px 14px; min-height:44px; flex:none; }
  .card-title{
    display:-webkit-box; font-size:15.5px; font-weight:700; font-family:'Fraunces',serif;
    color:var(--paper) !important; line-height:1.28; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; opacity:1; visibility:visible;
  }

  /* ---- modo organizar: alcinha para arrastar + selo de seleção ---- */
  .reorder-handle{
    position:absolute; top:9px; right:9px; z-index:3;
    width:32px; height:32px; border-radius:9px;
    background:rgba(10,9,15,.86); backdrop-filter:blur(6px); color:var(--paper);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 14px -4px rgba(0,0,0,.5);
    cursor:grab; touch-action:none;
  }
  .reorder-handle:active{ cursor:grabbing; }
  .reorder-select-badge{
    position:absolute; top:9px; left:9px; z-index:3;
    width:26px; height:26px; border-radius:50%;
    background:rgba(10,9,15,.7); border:1.5px solid var(--line-strong); color:transparent;
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800;
    transition:background .2s, border-color .2s, color .2s, transform .2s;
  }
  .card.is-selected .reorder-select-badge{
    background:var(--aurora); border-color:var(--aurora); color:#0f2b23; transform:scale(1.08);
  }

  /* ---- modo organizar: barra flutuante com setas grandes ---- */
  .reorder-toolbar{
    position:fixed; left:50%; bottom:26px; z-index:40;
    transform:translate(-50%,18px); opacity:0; pointer-events:none;
    background:var(--dusk); border:1px solid var(--line-strong); border-radius:22px;
    padding:16px 20px; box-shadow:var(--shadow-pop);
    display:flex; flex-direction:column; align-items:center; gap:11px;
    transition:opacity .3s var(--ease), transform .35s var(--ease-spring);
  }
  .reorder-toolbar.show{ opacity:1; transform:translate(-50%,0); pointer-events:auto; }
  .reorder-toolbar-label{ font-size:12.5px; font-weight:800; color:var(--aurora); letter-spacing:.03em; }
  .reorder-toolbar-arrows{ display:grid; grid-template-columns:58px 58px 58px; grid-template-rows:56px 56px; gap:8px; }
  .reorder-toolbar-btn{
    background:var(--card); border:1px solid var(--line-strong); color:var(--paper);
    border-radius:15px; display:flex; align-items:center; justify-content:center;
    transition:background .2s, transform .15s, border-color .2s;
  }
  .reorder-toolbar-btn:hover{ background:var(--bloom); border-color:var(--bloom); color:var(--bloom-ink); }
  .reorder-toolbar-btn:active{ transform:scale(.88); }
  #rt-up{ grid-column:2; grid-row:1; }
  #rt-left{ grid-column:1; grid-row:2; }
  #rt-down{ grid-column:2; grid-row:2; }
  #rt-right{ grid-column:3; grid-row:2; }
  .reorder-toolbar-clear{ background:none; border:none; color:var(--mist); font-size:12px; font-weight:700; padding:2px 4px; transition:color .2s; }
  .reorder-toolbar-clear:hover{ color:var(--paper); }

  .empty-state{ grid-column:1/-1; text-align:center; padding:64px 20px; color:var(--mist); }
  .empty-state svg{ width:40px; height:40px; margin-bottom:14px; opacity:.6; }
  .empty-state p{ margin:0; font-size:14.5px; line-height:1.6; }
  .empty-state strong{ color:var(--paper); display:block; font-family:'Fraunces',serif; font-size:20px; margin-bottom:8px; font-weight:600; }

  /* ============ TOAST ============ */
  #toast{
    position:fixed; left:50%; bottom:28px; transform:translate(-50%,20px);
    background:var(--card); border:1px solid var(--line-strong); color:var(--paper);
    padding:13px 22px; border-radius:999px; font-size:13.5px; font-weight:600;
    box-shadow:var(--shadow-pop); z-index:100; opacity:0; pointer-events:none;
    transition:opacity .35s var(--ease), transform .35s var(--ease);
    display:flex; align-items:center; gap:8px;
  }
  #toast.show{ opacity:1; transform:translate(-50%,0); }
  #toast.error{ border-color:rgba(255,138,138,.35); }

  /* ============ OVERLAYS / MODALS ============ */
  .overlay{
    position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    padding:24px; background:rgba(7,6,11,.7); backdrop-filter:blur(8px);
    opacity:0; visibility:hidden; transition:opacity .35s var(--ease), visibility 0s linear .35s;
  }
  .overlay.open{ opacity:1; visibility:visible; transition:opacity .35s var(--ease), visibility 0s; }
  .modal{
    background:var(--dusk); border:1px solid var(--line); border-radius:var(--radius-lg);
    width:100%; max-width:460px; max-height:88vh; overflow-y:auto; padding:30px;
    transform:translateY(16px) scale(.97); transition:transform .4s var(--ease-spring);
  }
  .overlay.open .modal{ transform:translateY(0) scale(1); }
  .modal-select{ max-width:740px; }
  .modal h3{ font-size:22px; margin-bottom:5px; }
  .modal-hint{ color:var(--mist); font-size:13.5px; margin:0 0 20px; line-height:1.5; }

  .field{ margin-bottom:16px; }
  .field label{
    display:block; font-size:11.5px; font-weight:700; letter-spacing:.08em;
    text-transform:uppercase; color:var(--mist); margin-bottom:8px;
  }

  .toggle-group{ display:flex; gap:9px; }
  .toggle-btn{
    flex:1; background:var(--ink); border:1.5px solid var(--line); color:var(--mist);
    padding:10px; border-radius:var(--radius-sm); font-weight:700; font-size:13.5px;
    transition:background .25s, border-color .25s, color .25s, transform .2s;
  }
  .toggle-btn:active{ transform:scale(.97); }
  .toggle-btn.active{ border-color:var(--line-strong); color:var(--paper); }
  .toggle-btn.is-yes.active{ background:var(--aurora); border-color:var(--aurora); color:#0f2b23; }
  .link-picker{ animation:rise .3s var(--ease) both; }

  .season-nav{ display:flex; gap:9px; margin-bottom:18px; flex-wrap:wrap; }
  .season-nav:empty{ display:none; margin:0; }
  .season-nav-btn{
    background:var(--card); border:1px solid var(--line); color:var(--paper);
    padding:8px 14px; border-radius:999px; font-size:12.5px; font-weight:700;
    display:inline-flex; align-items:center; gap:6px; transition:border-color .25s, transform .25s;
  }
  .season-nav-btn:hover{ border-color:rgba(255,143,177,.35); transform:translateY(-1px); }

  /* ---- padronização total dos campos de entrada ---- */
  .field input[type="text"],
  .field input[type="date"],
  .field input[type="number"]{
    width:100%; height:46px; box-sizing:border-box;
    background:var(--ink); border:1px solid var(--line); color:var(--paper);
    padding:0 14px; border-radius:var(--radius-sm); font-size:14.5px; font-family:inherit;
    transition:border-color .25s, background .25s;
    -moz-appearance:textfield;
  }
  .field input[type="text"]:focus,
  .field input[type="date"]:focus,
  .field input[type="number"]:focus{ outline:none; border-color:rgba(255,143,177,.4); background:var(--card); }
  .field input::placeholder{ color:var(--mist-dim); }
  .field input[type="date"]{ color-scheme:dark; }
  .field input[type="number"]::-webkit-outer-spin-button,
  .field input[type="number"]::-webkit-inner-spin-button{
    -webkit-appearance:inner-spin-button; opacity:.6; margin-left:6px;
  }

  .rating-row{ display:flex; align-items:center; gap:14px; }
  .rating-row input[type="range"]{ flex:1; accent-color:var(--bloom); height:20px; }
  .rating-value{ font-family:'Fraunces',serif; font-weight:700; font-size:16px; color:var(--aurora); min-width:48px; text-align:right; }

  .field textarea{
    width:100%; min-height:84px; box-sizing:border-box; resize:vertical;
    background:var(--ink); border:1px solid var(--line); color:var(--paper);
    padding:12px 14px; border-radius:var(--radius-sm); font-size:14.5px; font-family:inherit; line-height:1.5;
    transition:border-color .25s, background .25s;
  }
  .field textarea:focus{ outline:none; border-color:rgba(255,143,177,.4); background:var(--card); }
  .field textarea::placeholder{ color:var(--mist-dim); }

  .dropzone{
    display:flex; align-items:center; gap:15px; border:1.5px dashed var(--line);
    border-radius:var(--radius-md); padding:13px; cursor:pointer;
    transition:border-color .25s, background .25s;
  }
  .dropzone:hover{ border-color:rgba(255,143,177,.4); background:rgba(255,143,177,.04); }
  .dropzone-preview{
    width:58px; height:58px; border-radius:11px; background:var(--ink); overflow:hidden;
    flex:none; display:flex; align-items:center; justify-content:center;
  }
  .dropzone-preview img{ width:100%; height:100%; object-fit:cover; }
  .dropzone-preview svg{ width:22px; height:22px; color:var(--mist); }
  .dropzone-text{ font-size:13px; color:var(--mist); line-height:1.5; }
  .dropzone-text strong{ color:var(--paper); font-weight:700; }
  .dropzone input[type="file"]{ display:none; }

  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:24px; flex-wrap:wrap; }
  .modal-actions.split{ justify-content:space-between; }

  .select-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:13px; max-height:56vh; overflo
